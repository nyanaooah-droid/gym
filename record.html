<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1417">
<title>動作紀錄</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="page">
  <div class="rec-bar">
    <a class="icon-btn" id="back-link" href="index.html" aria-label="返回">‹</a>
    <h1 id="ex-title"></h1>
    <button class="icon-btn" id="hist-btn" type="button" aria-label="歷史紀錄"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg></button>
  </div>
  <div class="date-row"><span id="cal-ic"></span>日期 <b id="date-text"></b></div>
  <div class="last-row" id="last-row" hidden><button class="last" id="last" type="button"></button><button class="chip" id="fill" type="button">帶入上次</button></div>

  <div class="sets-head"><span>組數</span><span>重量 kg</span><span>次數</span><span>休息 秒</span><span></span></div>
  <div id="sets"></div>

  <button class="add-set" id="add-set" type="button">＋ 新增一組</button>
</main>
<div class="savebar"><button class="save" id="save" type="button">儲存記錄</button></div>
<div class="sheet" id="sheet" hidden><div class="sheet-in" id="sheet-in"></div></div>
<script src="shared.js"></script>
<script>
renderNav('home');
const q = new URLSearchParams(location.search);
const exPart = q.get('part'), exName = q.get('name');
if (!PARTS.some(p => p.id === exPart) || !(EXERCISES[exPart] || []).includes(exName)) location.replace('index.html');
else {
  const ex = (load(KEY_ACTIVE, null)?.exercises || []).find(e => e.part === exPart && e.name === exName) || {part: exPart, name: exName};
  $('cal-ic').innerHTML = ICON.calendar;
  $('ex-title').textContent = ex.name;
  document.title = ex.name;
  $('back-link').href = 'part.html?part=' + exPart;
  $('date-text').textContent = `今天・${dateKey(new Date())}`;

  // Each row is one set: weight (kg), reps and a free-form rest time (seconds).
  let rows = (ex.sets || []).map(x => ({kg: x.kg, reps: x.reps, rest: x.rest || 0}));
  if (!rows.length) rows = [{kg: 0, reps: 0, rest: 0}];

  let dirty = false;
  const drawRows = () => {
    $('sets').innerHTML = rows.map((r, i) => {
      const n = i + 1;
      return `<div class="set-row"><span class="set-no">${n}</span>
        <input type="number" inputmode="decimal" min="0" step="any" data-i="${i}" data-k="kg" value="${r.kg || ''}" placeholder="0" aria-label="第${n}組重量">
        <input type="number" inputmode="numeric" min="0" step="1" data-i="${i}" data-k="reps" value="${r.reps || ''}" placeholder="0" aria-label="第${n}組次數">
        <input type="number" inputmode="numeric" min="0" step="5" data-i="${i}" data-k="rest" value="${r.rest || ''}" placeholder="0" aria-label="第${n}組休息秒數">
        ${rows.length > 1 ? `<button class="set-del" data-del="${i}" type="button" aria-label="刪除第${n}組">${ICON.x}</button>` : '<span></span>'}</div>`;
    }).join('');
  };
  $('sets').addEventListener('input', e => {
    const t = e.target; if (!t.dataset.k) return;
    rows[t.dataset.i][t.dataset.k] = Math.max(0, parseFloat(t.value) || 0);
    dirty = true;
  });
  $('sets').addEventListener('click', e => {
    const d = e.target.closest('[data-del]'); if (!d) return;
    rows.splice(Number(d.dataset.del), 1);
    if (!rows.length) rows = [{kg: 0, reps: 0, rest: 0}];
    dirty = true;
    drawRows();
  });
  $('add-set').onclick = () => {
    const l = rows[rows.length - 1];
    rows.push({kg: l.kg, reps: l.reps, rest: l.rest});
    dirty = true;
    drawRows();
    window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'});
  };

  $('save').onclick = () => {
    const clean = rows.filter(r => r.kg > 0 || r.reps > 0)
      .map(r => r.rest > 0 ? {kg: r.kg, reps: r.reps, rest: r.rest} : {kg: r.kg, reps: r.reps});
    const w = load(KEY_ACTIVE, null) || {startedAt: new Date().toISOString(), exercises: []};
    const i = w.exercises.findIndex(e => e.part === exPart && e.name === exName);
    if (clean.length) {
      if (i >= 0) w.exercises[i].sets = clean; else w.exercises.push({part: exPart, name: exName, sets: clean});
    } else if (i >= 0) w.exercises.splice(i, 1);
    if (w.exercises.length || load(KEY_ACTIVE, null)) save(KEY_ACTIVE, w);
    toastNext(`已儲存 ${exName}`);
    dirty = false;
    location.href = 'part.html?part=' + exPart;
  };

  // Warn before leaving with unsaved changes
  $('back-link').addEventListener('click', async e => {
    if (!dirty) return;
    e.preventDefault();
    if (await confirmDialog('還沒儲存，確定要離開嗎？', '離開')) { dirty = false; location.href = $('back-link').href; }
  });

  // Past records of this exercise, newest first
  const past = load(KEY_HISTORY, []).slice()
    .sort((x, y) => y.date.localeCompare(x.date))
    .flatMap(h => (h.exercises || []).filter(e => e.name === ex.name && e.part === ex.part && e.sets?.length)
      .map(e => ({date: h.date, sets: e.sets})));
  const fmt = d => `${d}（週${'日一二三四五六'[new Date(d + 'T00:00:00').getDay()]}）`;
  const line = s => `${s.kg}kg×${s.reps}`;
  if (past.length) {
    $('last-row').hidden = false;
    $('last').textContent = `上次 ${past[0].date.slice(5).replace('-','/')}：${past[0].sets.map(line).join('、')}`;
    $('fill').hidden = !!(ex.sets && ex.sets.length);
    $('fill').onclick = () => {
      rows = past[0].sets.map(x => ({kg: x.kg, reps: x.reps, rest: x.rest || 0}));
      dirty = true; drawRows(); $('fill').hidden = true; toast('已帶入上次的組數');
    };
  }
  const openHist = () => {
    $('sheet-in').innerHTML = `<div class="sheet-head"><h3>${ex.name}・歷史紀錄</h3><button class="icon-btn" id="sheet-x" type="button" aria-label="關閉">${ICON.x}</button></div>` + (past.length
      ? past.map(r => `<div class="rec"><p class="part-name">${fmt(r.date)}</p><ul>${r.sets.map((s,i) =>
          `<li>第 ${i+1} 組　${s.kg} kg × ${s.reps}${s.rest ? `<br><small class="sets-line">休息 ${s.rest} 秒</small>` : ''}</li>`).join('')}</ul></div>`).join('')
      : '<p class="empty-note">還沒有這個動作的歷史紀錄</p>');
    $('sheet').hidden = false;
    $('sheet-x').onclick = () => { $('sheet').hidden = true; };
  };
  $('hist-btn').onclick = openHist;
  $('last').onclick = openHist;
  document.addEventListener('keydown', e => { if (e.key === 'Escape') $('sheet').hidden = true; });
  $('sheet').onclick = e => { if (e.target === $('sheet')) $('sheet').hidden = true; };
  drawRows();
}
</script>
</body>
</html>
