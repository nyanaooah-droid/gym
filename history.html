<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1417">
<title>全年紀錄</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="page">
  <h1>全年紀錄</h1>
  <div class="sum-row"><p class="year-sum" id="year-sum"></p><button class="chip" id="today-btn" type="button">回到今天</button></div>
  <div class="cal-head">
    <button type="button" id="prev" aria-label="上個月">‹</button>
    <h2 id="month-title"></h2>
    <button type="button" id="next" aria-label="下個月">›</button>
  </div>
  <div class="cal" id="cal"></div>
  <p class="legend"><i></i>有訓練紀錄</p>
  <section class="day-detail" id="detail"></section>
</main>
<script src="shared.js"></script>
<script>
renderNav('history');
const history = load(KEY_HISTORY, []);
const byDate = {};
for (const h of history) (byDate[h.date] ||= []).push(h);
const today = new Date();
let year = today.getFullYear(), month = today.getMonth(), selected = dateKey(today);

function draw(){
  $('month-title').textContent = `${year} 年 ${month+1} 月`;
  const yearDays = Object.keys(byDate).filter(k => k.startsWith(year + '-')).length;
  $('year-sum').innerHTML = `${year} 年共訓練 <b>${yearDays}</b> 天`;
  const lead = (new Date(year, month, 1).getDay() + 6) % 7; // Monday first
  const total = new Date(year, month + 1, 0).getDate();
  let html = ['一','二','三','四','五','六','日'].map(d => `<div class="dow">${d}</div>`).join('');
  html += '<div class="day empty"></div>'.repeat(lead);
  for (let d = 1; d <= total; d++) {
    const k = `${year}-${pad(month+1)}-${pad(d)}`;
    const cls = ['day', byDate[k] && 'has', k === dateKey(today) && 'today', k === selected && 'sel'].filter(Boolean).join(' ');
    html += `<button type="button" class="${cls}" data-date="${k}">${d}</button>`;
  }
  $('cal').innerHTML = html;
  drawDetail();
}
function drawDetail(){
  const [y, m, d] = selected.split('-').map(Number);
  let html = `<h3>${y} 年 ${m} 月 ${d} 日</h3>`;
  const recs = byDate[selected];
  if (!recs) html += '<p class="empty-note">這天沒有訓練紀錄</p>';
  else {
    const groups = {};
    for (const r of recs) for (const e of r.exercises || []) (groups[e.part] ||= []).push(e);
    html += PARTS.filter(p => groups[p.id]).map(p =>
      `<div class="rec"><p class="part-name">${p.name}</p><ul>${groups[p.id].map(e => `<li>${e.name}${e.sets?.length ? `<br><small class="sets-line">${e.sets.map(s => `${s.kg}kg×${s.reps}`).join('、')}</small>` : ''}</li>`).join('')}</ul></div>`
    ).join('');
  }
  $('detail').innerHTML = html;
}
$('cal').addEventListener('click', e => {
  const b = e.target.closest('.day[data-date]'); if (!b) return;
  selected = b.dataset.date; draw();
});
const shift = n => { month += n; if (month < 0) { month = 11; year--; } if (month > 11) { month = 0; year++; } draw(); };
$('today-btn').onclick = () => { year = today.getFullYear(); month = today.getMonth(); selected = dateKey(today); draw(); };
$('prev').onclick = () => shift(-1);
$('next').onclick = () => shift(1);
draw();
</script>
</body>
</html>
